# dsh-plugin-startup-auditor — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "diskmap".
# Tools resultantes: mcp__diskmap__* (ver README).
- insert:
    - id: mcp-startup-auditor
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: startup
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/startup-auditor/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
